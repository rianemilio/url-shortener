# Coleta (scrape) das métricas expostas pela stack. Intervalo curto de propósito: em
# desenvolvimento, o gráfico reage em segundos quando você derruba ou religa um serviço.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # rabbitmq_prometheus, ligado por padrão na imagem. O /metrics padrão agrega tudo sem
  # o nome da fila; o /metrics/per-object traz uma série por fila (cliques e DLQ).
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
