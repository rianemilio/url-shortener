services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    # Só para desenvolvimento: o usuário padrão guest/guest tem acesso total ao broker. Em
    # produção, defina RABBITMQ_DEFAULT_USER/RABBITMQ_DEFAULT_PASS (e ajuste APP_RABBITMQ_URI).
    ports:
      # Painel de management só no localhost: publicado como "15672:15672", ficaria aberto
      # para a rede inteira com guest/guest.
      - "127.0.0.1:15672:15672"
    healthcheck:
      # su-exec: rodar a CLI como root cria o .erlang.cookie com dono errado e derruba o broker.
      # check_port_connectivity (e não ping): só fica healthy quando a porta AMQP aceita conexões.
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_MONGO_URI: mongodb://mongo:27017
      APP_REDIS_URI: redis://redis:6379/0
      APP_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      APP_BASE_URL: http://localhost:8000
      # Só para desenvolvimento: em produção defina APP_CODE_SECRET com um valor aleatório
      # (ex.: `openssl rand -hex 32`). Quem conhece a chave consegue enumerar os códigos.
      APP_CODE_SECRET: ${APP_CODE_SECRET:-dev-only-troque-esta-chave}
      # Atrás de um proxy reverso, liste o IP dele para o uvicorn confiar no X-Forwarded-For
      # (senão o rate limit enxerga todos os clientes como o proxy).
      # FORWARDED_ALLOW_IPS: "10.0.0.2"
    healthcheck:
      # urlopen levanta erro em 503 (sem Mongo); "degraded" (200) conta como saudável.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "url_shortener.interface.worker.click_consumer"]
    environment:
      APP_MONGO_URI: mongodb://mongo:27017
      APP_REDIS_URI: redis://redis:6379/0
      APP_RABBITMQ_URI: amqp://guest:guest@rabbitmq:5672/
      APP_CODE_SECRET: ${APP_CODE_SECRET:-dev-only-troque-esta-chave}
    healthcheck:
      # O worker toca um arquivo de heartbeat enquanto Mongo e RabbitMQ respondem; o check
      # falha se ele envelhecer (ex.: loop travado ou dependência fora).
      test: ["CMD", "python", "-m", "url_shortener.interface.worker.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongo_data:
